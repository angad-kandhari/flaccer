name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack
      - run: npm run dmg
      - name: Publish the DMG (never replaces a DMG that was uploaded by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '\.dmg$'; then
              echo "release $TAG already has a DMG; leaving it alone"
            else
              gh release upload "$TAG" dist/*.dmg
            fi
          else
            gh release create "$TAG" dist/*.dmg --title "FLACCER $TAG" --generate-notes
          fi
